version: "3.9"

# CTI Platform — Docker Compose
# Runs: PostgreSQL, FastAPI, Streamlit Dashboard, Scheduler

services:

  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: cti-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cti_db
      POSTGRES_USER: cti_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cti_secure_pass}
    volumes:
      - cti_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cti_user -d cti_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI REST API ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cti-api
    restart: unless-stopped
    command: python -m uvicorn api.app:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cti_user:${POSTGRES_PASSWORD:-cti_secure_pass}@db:5432/cti_db
      APP_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Streamlit Dashboard ──────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cti-dashboard
    restart: unless-stopped
    command: >
      streamlit run dashboard/app.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
      --browser.gatherUsageStats=false
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cti_user:${POSTGRES_PASSWORD:-cti_secure_pass}@db:5432/cti_db
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy

  # ── Background Scheduler ─────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cti-scheduler
    restart: unless-stopped
    command: python src/scheduler.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cti_user:${POSTGRES_PASSWORD:-cti_secure_pass}@db:5432/cti_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - cti_data:/app/data

volumes:
  cti_pgdata:
  cti_data:
